<style>
:root{--bg:#fff;--fg:#1c1c1c;--mut:#666;--ln:#ddd;--ac:#1f3864}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px/1.35 -apple-system,Helvetica,Arial,sans-serif;color:var(--fg)}
#map{position:absolute;inset:0}
#bar{position:absolute;z-index:1000;top:calc(10px + env(safe-area-inset-top));left:56px;right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bar>*{pointer-events:auto}
.row{display:flex;gap:6px;flex-wrap:wrap}
#q{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
select,.btn{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.dec{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.dec::-webkit-scrollbar{display:none}
.dec button{flex:0 0 auto;font:600 13px system-ui;padding:7px 10px;border-radius:16px;border:2px solid #fff;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:.45}
.dec button.on{opacity:1}
#cnt{align-self:flex-start;background:rgba(255,255,255,.92);border-radius:8px;padding:4px 8px;font-size:12.5px;color:#333;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.yr{display:inline-block;transform:translate(-50%,-50%);font:700 11px system-ui;color:#fff;padding:1px 5px;border-radius:10px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap}
.yr.est{font-weight:600;opacity:.85}
.leaflet-popup-content{margin:12px 14px;font-size:14px;min-width:220px}
.pop b.y{font-size:22px}.pop .a{font-weight:700;font-size:15px;margin-top:2px}.pop .m{color:var(--mut);font-size:13px}
.pop .st{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0;font-size:12.5px}.pop .st div{background:#f1f2f4;border-radius:6px;padding:4px 6px}.pop .st small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase}
.pop .lk{display:flex;gap:6px;flex-wrap:wrap}.pop .lk a{flex:1;text-align:center;padding:8px 6px;border-radius:8px;background:var(--ac);color:#fff;text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.pop .note{background:#fff3c4;color:#5a4500;border-radius:6px;padding:5px 7px;font-size:12.5px;margin-top:6px}
.marker-cluster div{font-weight:700}
#loc{position:absolute;z-index:1000;right:10px;bottom:calc(30px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:20px}
@media (max-width:600px){.yr{font-size:10px;padding:1px 4px;border-width:1.5px}#q{font-size:16px}.dec button{font-size:12px;padding:6px 8px}select,.btn{font-size:13px;padding:7px 8px}#bar .row{flex-wrap:nowrap}#q{min-width:0}}</style>
